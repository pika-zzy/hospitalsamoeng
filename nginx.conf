# Temporary preview hostnames must never be indexed: while the ministry domain
# is pending, the site is reachable at web.samoenghospital.com through a
# Cloudflare Tunnel. If Google indexed that host, the real domain would later
# show up as a duplicate competing with a URL we no longer control.
# robots.txt cannot express this (it is served for every host alike), and a
# Disallow would only stop crawling, not indexing of the bare URL.
# An empty value makes nginx skip add_header entirely, so the real domain is
# served exactly as before.
map $host $robots_tag {
    default                 "";
    web.samoenghospital.com "noindex, nofollow";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip for text assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Robots-Tag $robots_tag always;

    # SPA client-side routing (TanStack Router): any unknown path must fall
    # back to index.html, otherwise deep links / F5 reloads would 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints asset filenames, so they are safe to cache forever.
    # NOTE: add_header does not merge across levels — a block that sets any
    # header drops every inherited one, so X-Robots-Tag is repeated here and
    # below rather than relying on the server-level directive.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag $robots_tag always;
    }

    # index.html must never be cached, so a new deploy is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Robots-Tag $robots_tag always;
    }
}
